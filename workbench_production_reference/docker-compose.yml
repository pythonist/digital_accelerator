version: "3.9"

services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "8088:8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=INFO"]
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
    ports:
      - "5434:5432"
    volumes:
      - workbench_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6385:6379"
    volumes:
      - workbench_redis_data:/data
    restart: unless-stopped

volumes:
  workbench_postgres_data:
  workbench_redis_data:
