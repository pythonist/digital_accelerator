version: "3.9"

services:
  ai-aml-tool:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      AML_BACKEND_PROFILE: "${AML_BACKEND_PROFILE:-full}"
      AML_AUTO_BOOTSTRAP_VENV: "0"
      PORT: "5000"
      APP_PORT: "5000"
      FLASK_DEBUG: "0"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-8}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-600}"
    volumes:
      - ./backend/data:/app/backend/data
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
