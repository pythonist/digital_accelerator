version: "3.9"

services:
  ai-aml-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-aml-tool
    ports:
      - "5000:5000"
    environment:
      AML_BACKEND_PROFILE: mlops
      AML_AUTO_BOOTSTRAP_VENV: "0"
      PORT: "5000"
      APP_PORT: "5000"
      FLASK_DEBUG: "0"
    volumes:
      - ./backend/data:/app/backend/data
      - ./data:/app/data
    restart: unless-stopped

